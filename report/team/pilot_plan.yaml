# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (statsmodels Cohen h: 1.250)
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48 → 3.103 yêu cầu mỗi nhóm → 42 nhân viên mỗi nhóm, tổng 84 > 40: không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa < c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa < 6 / 0,02 = 300 < 1.251: không đạt
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m ≥ 859 × (0,98 + 0,02m) → m ≥ 299 yêu cầu mỗi người (DE 6,96); nếu tác động thật chỉ +5 điểm thì power còn 0,64
#
# Cách chia đã chọn: theo nhân viên (staff), 20 người nhóm trợ lý + 20 người nhóm đối chứng.
#   Theo yêu cầu thì đủ mẫu nhưng cùng một nhân viên vừa dùng vừa không dùng trợ lý → tràn tác động cao, kết quả khó tin.
#   Theo depot chỉ có 6 cụm mỗi nhóm (< 20) và tối đa 300 mẫu hiệu dụng → loại.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng depot, cùng loại yêu cầu với nhóm trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot; quản lý không được chọn người.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên chia sẻ câu trả lời trong depot; giảm bằng cấp quyền trợ lý theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, MDE 6 điểm, các luật dừng và ngày quyết định 2027-01-05 chốt trước ngày bắt đầu 2026-12-01.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Không cách chia theo cụm nào đủ mẫu cho 5 điểm với 40 nhân viên. Nhóm chấp nhận mức chênh tối thiểu phát hiện được là 6 điểm
#   (859 mẫu hiệu dụng mỗi nhóm, mỗi nhân viên ≥ 299 yêu cầu). Con số bất lợi: nếu tác động thật chỉ +5 điểm thì power còn 0,64.
#   Giám đốc vận hành phải ký chấp nhận đánh đổi này trước ngày bắt đầu.
#   Lịch: khoảng 1.500 × 82% ≈ 1.230 yêu cầu noi_dia + hang_nang mỗi ngày / 40 người ≈ 30 yêu cầu/người/ngày
#   → cần khoảng 10 ngày làm việc ở bước 0.50 để đạt 299 yêu cầu/người, cộng 7 ngày chờ đo mở lại.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: toàn mẫu 4,25% (51/1.200); phạm vi noi_dia + hang_nang 3,97% (39/982).
#   Ngưỡng an toàn: nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên, kèm trần tuyệt đối 6%.
#   Không dùng ngưỡng tuyệt đối 3% vì tỉ lệ hiện tại đã gần 4%, pilot sẽ bị dừng ngay tuần đầu.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated), 40 nhân viên CSKH ở 12 depot; loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, có điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 → 10 → 20 nhân viên nhóm trợ lý; chỉ đo chỉ số chính ở bước 0.50 (2 tuần)
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 5 điểm không đủ mẫu với 40 nhân viên
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # mẫu hiệu dụng; tương ứng 20 người × 299 = 5.980 yêu cầu thực mỗi nhóm
    design_effect: 6.96           # 1 + (299 − 1) × 0,02
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng thời gian, cùng depot, cùng loại yêu cầu"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; giảm bằng cấp quyền theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, MDE 0,06, ba luật dừng và ngày quyết định 2027-01-05 chốt trước ngày bắt đầu 2026-12-01; bốc thăm bằng seed ghi trước, phân tầng theo depot"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên hoặc vượt 6% TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và chuyển toàn bộ về nhân viên tự làm KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU có từ 1 ca hoàn trùng hoặc 1 tin nhắn báo đã hoàn mà không có bản ghi sổ cái ok cùng trace_id TRONG bất kỳ ngày nào THÌ Kỹ sư trưởng agent tắt bước ghi hoàn tiền tự động trong 30 phút và đối soát lại mọi ca trong ngày KHÔNG THÌ không được bật lại trước khi khoá chống trùng được kiểm tra"
    - "NẾU chi phí mỗi việc thành công trong phạm vi (đã cộng cố định, phút xem lại đo thật) vượt 9.600 đ tức 0,8× của 12.000 đ TRONG 2 tuần liên tiếp kể từ bước 0.25 THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy trong 2 ngày KHÔNG THÌ không được giữ hang_nang trong pilot"
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa + bỏ) vượt 40% (đợt chạy thử 27,12%) TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên nhóm trợ lý trong 3 ngày và báo cáo nguyên nhân KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như trước pilot, yêu cầu đang dở được chuyển cho nhân viên kèm tóm tắt và trace_id"
  decision_date: "2027-01-05"     # bắt đầu 2026-12-01; tuần 1 bước 0.10, tuần 2 bước 0.25, tuần 3-4 bước 0.50; cộng 7 ngày chờ đo mở lại
  simulated_inputs:               # liệt kê mọi con số giả lập đã dùng
    - "phut_xem_lai_simulated: tổng 890 phút → 1.780.000 đ"
    - "phut_lam_lai_simulated: tổng 1.132 phút → 2.264.000 đ"
    - "Chi phí mỗi việc thành công 4.472 đ (toàn mẫu), 3.414 đ (noi_dia + hang_nang)"
    - "Chi phí + cố định 4.599 đ = 0,38× ở 45.000 yêu cầu/tháng; 5.784 đ = 0,48× ở một nửa"
    - "Xem lại 100%: 11.743 đ = 0,98× (9 phút làm lại), 12.415 đ = 1,03× (15,3 phút)"
    - "Bảng độ nhạy B1–B3 (mọi kịch bản tính từ hai cột _simulated)"
    - "Chi phí theo loại A3: noi_dia 0,22×, hang_nang 0,69×, quoc_te 1,88×, doi_tac 0,85×"
